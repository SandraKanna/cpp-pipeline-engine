name: CI

# Triggers: validate main after every merge (push) and every PR before merging.
# `branches` under pull_request filters by the PR's *target* branch.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel superseded runs to save CI minutes:
# - PRs: group by PR number -> a new push cancels the previous run.
# - main: group by run_id (unique) -> every run completes, keeping full build history.
# (`cond && A || B` is the poor man's ternary; Actions has no real one.)
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# All build logic (flags, warnings-as-error, compiler choice) lives in
# CMakePresets.json, not here: any CI failure is reproducible locally
# with the exact same command. The CI is a dumb orchestrator.
jobs:
  build:
    # Fresh, disposable VM per job. Ubuntu runners ship gcc/clang/cmake/ninja.
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel the sibling job if one compiler fails:
      # "fails on gcc but not clang" is diagnostic info (probably undefined behavior).
      fail-fast: false
      # One independent job per compiler. Building with both is the cheap way
      # to ensure we write standard C++, not one compiler's dialect.
      matrix:
        compiler: [gcc, clang]
    # ${{ matrix.compiler }} expands to gcc/clang -> preset release-gcc / release-clang.
    steps:
    # The runner VM starts with an empty filesystem; this step clones the repo into it.
    - uses: actions/checkout@v7
    - name: Configure
      run: cmake --preset release-${{ matrix.compiler }}
    - name: Build
      run: cmake --build --preset release-${{ matrix.compiler }}
  
  test:
    # Separate job from build: tests run in Debug with sanitizers, which catch
    # memory and undefined-behavior errors that a Release build would hide.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Configure
      run: cmake --preset dev
    - name: Build
      run: cmake --build --preset dev
    - name: Test
      run: ctest --preset dev
  
  # verify lexical consistency across the project
  format-check:
    # Lightweight job: clang-format only reads files, so no configure or build.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    # Install clang-format 22 from LLVM's official script (Ubuntu ships older).
    # Pinned so CI formatting matches local: output changes between major versions.
    - name: Install clang-format 22
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 22
        sudo apt-get install -y clang-format-22

    - name: Check formatting
      run: clang-format-22 --dry-run --Werror src/*.cpp include/cpe/*.hpp tests/*.cpp

  # Separate job from format-check: clang-tidy analyzes semantics (linting), 
  # not layout, it needs the compilation database that a configure step produces.
  tidy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    # Same version pinning rationale as format-check: the check set changes
    # between major versions, so local and CI must run the same one.
    - name: Install clang-tidy 22
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 22
        sudo apt-get install -y clang-tidy-22
    # tidy needs the compilation database; configure generates it (no build needed).
    - name: Configure
      run: cmake --preset dev
    - name: Run clang-tidy
      run: clang-tidy-22 -p build/dev src/data_model.cpp src/acquisition/buffer_acquisition.cpp src/acquisition/file_acquisition.cpp src/deserialization/line_delimitation.cpp src/deserialization/raw_parsing.cpp src/processing/processing.cpp src/serialization/raw_serialization.cpp src/engine.cpp tests/data_model_test.cpp tests/buffer_acquisition_test.cpp tests/file_acquisition_test.cpp tests/line_delimitation_test.cpp tests/raw_parsing_test.cpp tests/engine_test.cpp
